name: daily-newsbot
on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC = 07:00 IST
  workflow_dispatch: {}       # manual runs for testing

permissions:
  contents: write             # needed to commit seen.json back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional overrides; both default to GMAIL_USER when unset.
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # Phase 2, optional
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}             # Phase 2, optional
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} # Phase 2, optional
        run: python -m src.main
      - name: Persist seen.json
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add seen.json
          git commit -m "update seen.json" || echo "no changes"
          git push
